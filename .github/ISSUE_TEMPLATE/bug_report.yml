name: Bug report
description: Report a bug in WAeys
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: input
    id: version
    attributes:
      label: WAeys version
      description: "Output of `import WAeys; print(WAeys.__version__)`"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: "e.g. 3.12.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Android (Termux)
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug, with the full traceback/log output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal script or steps that trigger the issue.
      placeholder: |
        1. Run ...
        2. See error ...
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      description: Never paste session files (creds.json, keys.json), phone numbers or tokens.
      options:
        - label: I confirm I did NOT include any session data, credentials or tokens.
          required: true
