name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Import check
        run: |
          python - <<'EOF'
          import WAeys
          print('version:', WAeys.__version__)
          from WAeys import Socket, Utils, WAProto, WABinary, Signal
          from WAeys.WAProto import WAProto as proto
          from WAeys.Utils.auth_utils import init_auth_creds
          from WAeys.Defaults.index import default_connection_config
          from WAeys.Socket.socket import make_socket
          creds = init_auth_creds()
          assert 'noiseKey' in creds and 'registrationId' in creds
          cfg = default_connection_config()
          assert cfg['waWebSocketUrl'].startswith('wss://')
          print('imports + auth creds OK')
          EOF

      - name: Build wheel & sdist
        run: |
          python -m pip install build
          python -m build

      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import zipfile, glob
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
          assert any(n.endswith('WAeys/__init__.py') for n in names)
          assert any(n.endswith('.proto') for n in names)
          assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
          print('wheel OK:', wheel)
          EOF
        shell: bash
